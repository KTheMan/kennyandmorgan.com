<!DOCTYPE html>
<html>
<head>
  <title>MyRegistry</title>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ItemList",
      "itemListElement": [
        {
          "@type": "ListItem",
          "position": 1,
          "item": {
            "@type": "Product",
            "name": "JSON-LD Item",
            "identifier": "myreg-json-1",
            "offers": {
              "price": "120.00",
              "url": "https://www.myregistry.com/item/json-1"
            },
            "image": "https://www.myregistry.com/images/json1.jpg"
          }
        }
      ]
    }
  </script>
</head>
<body>
  <div class="itemGiftVisitorList" giftid="myreg-html-1">
    <div class="gift-title">HTML Markup Item</div>
    <div class="gift-price">$75.00</div>
    <div class="desiredQty">1</div>
    <div class="receivedQty">0</div>
    <div class="gift-store">Amazon</div>
    <a href="/item/html-1">View Item</a>
    <img src="/images/html1.jpg" alt="Item Image">
  </div>
  <div class="itemGiftVisitorList" cashgiftid="myreg-cash-1">
    <div class="gift-title">Cash Fund</div>
    <div class="btnGiveCash">Contribute $20</div>
    <div class="gift-price">$20.00</div>
    <div class="desiredQty">100</div>
    <div class="receivedQty">20</div>
    <div class="gift-store">MyRegistry</div>
    <a href="/item/cash-1">View Fund</a>
  </div>
</body>
</html>
