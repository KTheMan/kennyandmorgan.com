name: Verify Supabase Database Migrations

on:
  pull_request:
    paths:
      - 'supabase/config.toml'
      - 'supabase/migrations/**'
      - '.github/workflows/verify-database-migrations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local database
        run: supabase db start

      - name: Apply local migrations
        run: supabase migration up --local

      - name: Lint local database
        run: supabase db lint --local

      - name: Stop local Supabase services
        if: always()
        run: supabase stop --no-backup
