name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Normalize changed wedding-party images
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python -m pip install --disable-pip-version-check Pillow==12.2.0 pillow-heif==1.3.0
          python - <<'PY'
          import os
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          from PIL import Image, ImageOps
          from pillow_heif import register_heif_opener

          register_heif_opener()

          repo_root = Path.cwd()
          images_dir = repo_root / 'images'
          normalized_dir = Path(tempfile.gettempdir()) / 'km-normalized-images'
          changed_files = set()
          targets = {
              'alexis.png': ('alexis.png', 'alexis.heic'),
              'alyssa.png': ('alyssa.png',),
              'anthony.png': ('anthony.png',),
              'cathy.png': ('cathy.png', 'cathy.jpeg'),
              'chayton.png': ('chayton.png',),
              'gabe.png': ('gabe.png', 'gabe.JPEG'),
              'haley.png': ('haley.png',),
              'jen.png': ('jen.png', 'jen.jpeg'),
              'kelcie.png': ('kelcie.png',),
              'najah.png': ('najah.png',),
              'raquel.png': ('raquel.png', 'raquel.heic'),
              'roy.png': ('roy.png',),
              'ryan.png': ('ryan.png',),
              'sam.png': ('sam.png',),
              'therese.png': ('therese.png',),
              'tim.png': ('tim.png', 'tim.heic'),
              'weston.png': ('weston.png',),
          }

          event_before = os.environ.get('GITHUB_EVENT_BEFORE', '').strip()
          event_name = os.environ.get('GITHUB_EVENT_NAME', '').strip()
          should_normalize_all = (
              event_name != 'push'
              or not event_before
              or set(event_before) == {'0'}
          )

          if not should_normalize_all:
              diff = subprocess.run(
                  ['git', 'diff', '--name-only', f'{event_before}..HEAD', '--', 'images'],
                  capture_output=True,
                  text=True,
                  check=False,
              )
              if diff.returncode != 0:
                  sys.stderr.write(diff.stderr)
                  raise SystemExit(diff.returncode)
              changed_files = {
                  Path(line.strip()).name
                  for line in diff.stdout.splitlines()
                  if line.strip()
              }

          dirty_targets = set(targets) if should_normalize_all else {
              target
              for target, candidates in targets.items()
              if any(candidate in changed_files for candidate in candidates)
          }

          if normalized_dir.exists():
              shutil.rmtree(normalized_dir)

          if not dirty_targets:
              print('No wedding-party source image changes detected; skipping normalization.')
              raise SystemExit(0)

          normalized_dir.mkdir(parents=True, exist_ok=True)

          for target_name in sorted(dirty_targets):
              candidates = targets[target_name]
              preferred_sources = [
                  images_dir / candidate
                  for candidate in candidates
                  if candidate in changed_files and (images_dir / candidate).exists()
              ]
              fallback_sources = [
                  images_dir / candidate
                  for candidate in candidates
                  if (images_dir / candidate).exists()
              ]
              source_path = next(iter(preferred_sources or fallback_sources), None)
              if source_path is None:
                  raise SystemExit(
                      f'Missing source image for {target_name}. Checked: {", ".join(candidates)}'
                  )

              target_path = normalized_dir / target_name
              with Image.open(source_path) as image:
                  normalized = ImageOps.exif_transpose(image)
                  if normalized.mode not in ('RGB', 'RGBA'):
                      normalized = normalized.convert('RGBA' if 'A' in normalized.getbands() else 'RGB')
                  normalized.save(target_path, format='PNG', optimize=True)
              print(f'Normalized {source_path.name} -> {target_path.name}')
          PY
      - uses: actions/configure-pages@v5
      - name: Prepare deploy artifact
        run: |
          mkdir -p dist
          cp index.html admin.html script.js admin.js styles.css site-config.js data-client.js .nojekyll dist/
          cp -R images dist/images
          if [ -d /tmp/km-normalized-images ]; then
            cp /tmp/km-normalized-images/*.png dist/images/
          fi
          cp -R vendor dist/vendor
      - name: Generate runtime config
        env:
          SITE_REGISTRY_PAGE_URL: ${{ vars.SITE_REGISTRY_PAGE_URL }}
          SITE_SUPABASE_URL: ${{ vars.SITE_SUPABASE_URL }}
          SITE_SUPABASE_ANON_KEY: ${{ secrets.SITE_SUPABASE_ANON_KEY }}
          SITE_SUPABASE_SESSION_TTL_MS: ${{ vars.SITE_SUPABASE_SESSION_TTL_MS || '3600000' }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          required = (
              'SITE_REGISTRY_PAGE_URL',
              'SITE_SUPABASE_URL',
              'SITE_SUPABASE_ANON_KEY',
          )
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              sys.stderr.write(
                  'Missing required GitHub Actions configuration: '
                  + ', '.join(missing)
                  + '\n'
              )
              raise SystemExit(1)

          try:
              session_ttl_ms = int(os.environ.get('SITE_SUPABASE_SESSION_TTL_MS', '3600000'))
          except ValueError as err:
              sys.stderr.write(f'Invalid SITE_SUPABASE_SESSION_TTL_MS: {err}\n')
              raise SystemExit(1)

          if session_ttl_ms <= 0:
              sys.stderr.write('SITE_SUPABASE_SESSION_TTL_MS must be greater than 0.\n')
              raise SystemExit(1)

          config = {
              'registryPageUrl': os.environ['SITE_REGISTRY_PAGE_URL'],
              'supabase': {
                  'url': os.environ['SITE_SUPABASE_URL'],
                  'anonKey': os.environ['SITE_SUPABASE_ANON_KEY'],
                  'sessionTtlMs': session_ttl_ms,
              },
              'localFallbackAccess': {
                  'familyPassword': '',
                  'partyPassword': '',
                  'adminPassword': '',
              },
          }

          with open('dist/site.config.json', 'w', encoding='utf-8') as file:
              json.dump(config, file, indent=2)
              file.write('\n')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
