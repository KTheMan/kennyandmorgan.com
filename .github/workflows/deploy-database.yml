name: Deploy Supabase Database

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/config.toml'
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-database.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-database-production
  cancel-in-progress: false

jobs:
  blocked_until_baselined:
    if: vars.SUPABASE_DB_MIGRATIONS_BASELINED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled deployment
        run: |
          echo "Production database deployment is disabled until the baseline is marked applied."
          echo "Run the Baseline Supabase Database Migrations workflow, then set SUPABASE_DB_MIGRATIONS_BASELINED=true."

  deploy:
    if: vars.SUPABASE_DB_MIGRATIONS_BASELINED == 'true'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate required configuration
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing secret: SUPABASE_ACCESS_TOKEN" >&2
            exit 1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Missing secret: SUPABASE_DB_PASSWORD" >&2
            exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "Missing variable: SUPABASE_PROJECT_ID" >&2
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: |
          supabase link \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Show migration status
        run: supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Preview database migrations
        run: supabase db push --linked --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Push database migrations
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Show final migration status
        run: supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"
